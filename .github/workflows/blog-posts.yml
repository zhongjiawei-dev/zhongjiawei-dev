name: Latest blog posts

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）同步一次
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull latest posts from blog RSS
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://z1934642491-eng.github.io/My-Blog/feed.xml"
          max_post_count: 5
          readme_path: ./README.md
          comment_tag_name: "BLOG-POST-LIST"
          template: "- [$title]($url) — $date"
          date_format: "yyyy-mm-dd"
          commit_message: "chore: sync latest blog posts"
